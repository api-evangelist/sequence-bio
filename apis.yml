name: Sequence Bio
description: >-
  Sequence Bio is a life sciences and population genomics company based in St. John's,
  Newfoundland and Labrador, Canada, focused on discovering the genetic causes of disease
  to power the development of new medicines. The company leverages the founder-effect
  genetics of the Newfoundland and Labrador population, running a large-scale Study of the
  Genetic Causes of Inherited Disease to identify novel drug targets and predictors of
  treatment response for pharmaceutical partners. Surfaced as a portfolio company of DCVC
  and profiled in the API Evangelist network; the company publishes a corporate and
  research website but does not currently expose a public developer program, API, or
  documentation surface.
